<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App Estilo Mac</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR MAC */
        .mac-title-bar {
            background-color: #e3e3e3;
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid #d1d1d1;
            -webkit-app-region: drag; /* 🚀 Arrastra la ventana */
            user-select: none;
        }

        .mac-buttons {
            display: flex;
            gap: 8px;
        }

        .mac-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            padding: 0;
            -webkit-app-region: no-drag; /* 🚀 Permite dar clic en botones */
        }

        /* Colores de Mac */
        .mac-btn.red { background-color: #ff5f56; border: 0.5px solid #e0443e; }
        .mac-btn.yellow { background-color: #ffbd2e; border: 0.5px solid #dfa023; }
        .mac-btn.green { background-color: #27c93f; border: 0.5px solid #1aab29; }

        .mac-btn.red:hover { background-color: #ff7c75; }
        .mac-btn.yellow:hover { background-color: #ffca5c; }
        .mac-btn.green:hover { background-color: #55d666; }

        .mac-title {
            flex-grow: 1;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #4d4d4d;
            margin-right: 50px;
        }

        .content {
            padding: 20px;
            flex-grow: 1;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- BARRA CON BOTONES DE MAC -->
    <div class="mac-title-bar">
        <div class="mac-buttons">
            <button id="mac-close" class="mac-btn red" title="Cerrar"></button>
            <button id="mac-minimize" class="mac-btn yellow" title="Minimizar"></button>
            <button id="mac-maximize" class="mac-btn green" title="Maximizar"></button>
        </div>
        <div class="mac-title">Mi Aplicación</div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="content">
        <h2>¡Hablalo, mano! 😎🔥</h2>
        <p>Tu app ya tiene la barra estilo Mac funcional y sin bordes de Windows.</p>
    </div>

    <!-- JAVASCRIPT INTEGRADO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnClose = document.getElementById('mac-close');
            const btnMinimize = document.getElementById('mac-minimize');
            const btnMaximize = document.getElementById('mac-maximize');

            // Detecta la API de ventana según el empaquetador
            function getNativeWindow() {
                if (window.require) {
                    try {
                        const electron = window.require('electron');
                        return electron.remote ? electron.remote.getCurrentWindow() : null;
                    } catch (e) {}
                }
                return null;
            }

            // 🛑 Botón Rojo: Cerrar
            btnClose.addEventListener('click', () => {
                const win = getNativeWindow();
                if (win) {
                    win.close();
                } else if (window.html2exe && window.html2exe.close) {
                    window.html2exe.close();
                } else {
                    window.close();
                }
            });

            // 🟡 Botón Amarillo: Minimizar
            btnMinimize.addEventListener('click', () => {
                const win = getNativeWindow();
                if (win) {
                    win.minimize();
                } else if (window.html2exe && window.html2exe.minimize) {
                    window.html2exe.minimize();
                } else if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage('minimize');
                }
            });

            // 🟢 Botón Verde: Maximizar / Restaurar
            btnMaximize.addEventListener('click', () => {
                const win = getNativeWindow();
                if (win) {
                    win.isMaximized() ? win.unmaximize() : win.maximize();
                } else if (window.html2exe && window.html2exe.maximize) {
                    window.html2exe.maximize();
                } else if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage('maximize');
                }
            });
        });
    </script>
</body>
</html>
