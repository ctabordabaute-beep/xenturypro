<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Xentury | Haciendolo Realidad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: default;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Capa de UI superpuesta - posición más arriba */
        .ui-overlay {
            position: fixed;
            top: 12%;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* Título Xentury */
        .xentury-title {
            pointer-events: none;
            text-align: center;
            margin-bottom: 8px;
            animation: titleFloat 4s ease-in-out infinite;
        }

        .xentury-title h1 {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-weight: 600;
            font-size: clamp(3rem, 10vw, 6rem);
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff, #e0e0ff, #ffffff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            margin: 0;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
        }

        /* Subtítulo: Haciendolo Realidad */
        .subtitle {
            pointer-events: none;
            font-family: 'Inter', monospace;
            font-size: clamp(0.8rem, 4vw, 1.1rem);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 400;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
            padding: 6px 18px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 4px;
            border: 0.5px solid rgba(255,255,255,0.2);
        }

        /* Contenedor del botón - más abajo del título */
        .discord-button-container {
            pointer-events: auto;
            margin-top: 28px;
        }

        /* Botón Discord - diseño elegante */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(20, 25, 35, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 60px;
            padding: 10px 28px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 0 0 rgba(255, 255, 255, 0);
        }

        .discord-btn:hover {
            background: rgba(88, 101, 242, 0.85);
            border-color: rgba(255, 255, 255, 0.7);
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 12px rgba(88, 101, 242, 0.5);
        }

        .discord-btn:active {
            transform: scale(0.98);
        }

        .discord-logo {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            transition: transform 0.2s ease;
        }

        .discord-btn:hover .discord-logo {
            transform: rotate(3deg) scale(1.05);
        }

        .discord-text {
            font-family: 'Inter', monospace;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.5px;
            color: white;
            text-shadow: 0 0 4px rgba(0,0,0,0.3);
        }

        @keyframes titleFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        /* Responsive móvil */
        @media (max-width: 600px) {
            .ui-overlay {
                top: 10%;
            }
            .discord-btn {
                padding: 8px 20px;
                gap: 8px;
            }
            .discord-logo {
                width: 20px;
                height: 20px;
            }
            .discord-text {
                font-size: 12px;
            }
            .subtitle {
                font-size: 0.7rem;
                padding: 4px 12px;
                letter-spacing: 1.5px;
            }
            .discord-button-container {
                margin-top: 22px;
            }
        }

        /* Eliminamos cualquier texto extra de topografía, solo queda limpio */
        .no-extra-text {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="organicCanvas"></canvas>

    <!-- Interfaz superpuesta: Título + Subtítulo + Botón Discord -->
    <div class="ui-overlay">
        <div class="xentury-title">
            <h1>XENTURY</h1>
            <div class="subtitle">Haciendolo Realidad</div>
        </div>
        <div class="discord-button-container">
            <div class="discord-btn" id="discordButton" role="button" tabindex="0" aria-label="Únete a Discord">
                <!-- SVG logo de Discord oficial -->
                <svg class="discord-logo" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.86.68,1.75,1.36,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.68,11.45-12.68S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.42,65.69,73.22,60,73.22,53s5-12.68,11.45-12.68S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z" fill="currentColor"/>
                </svg>
                <span class="discord-text">Únete a Discord</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('organicCanvas');
            let ctx = canvas.getContext('2d');
            
            let width, height;
            let time = 0;
            let animationId = null;
            
            // ---------- CONFIGURACIÓN ESTÉTICA ----------
            const CONTOUR_COUNT = 34;
            const HEIGHT_MIN = -1.3;
            const HEIGHT_MAX = 1.3;
            
            let sampleCols = 180;
            let sampleRows = 120;
            let heightMap = [];
            let contourLevels = [];
            
            // Función de altura orgánica - ondas fluidas topográficas
            function organicHeight(x, y, t) {
                const u = x * 3.8;
                const v = y * 3.5;
                
                const wave1 = Math.sin(u * 0.65 + t * 0.35) * Math.cos(v * 0.55 - t * 0.28);
                const wave2 = 0.7 * Math.sin(u * 1.4 - t * 0.9) * Math.sin(v * 1.2 + t * 0.75);
                
                const cx = 0.5 + 0.18 * Math.sin(t * 0.21);
                const cy = 0.5 + 0.15 * Math.cos(t * 0.27);
                const dx = x - cx;
                const dy = y - cy;
                const dist = Math.hypot(dx, dy);
                const radial = 0.5 * Math.sin(dist * 4.5 - t * 1.5) * Math.exp(-dist * 1.8);
                
                const ripples = 0.32 * (
                    Math.sin(u * 3.2 + t * 2.1) * Math.cos(v * 2.7) +
                    Math.cos(v * 3.4 - t * 1.7) * Math.sin(u * 2.5)
                );
                
                const angle = t * 0.2;
                const gx = (x - 0.5) * Math.cos(angle) + (y - 0.5) * Math.sin(angle);
                const flow = 0.22 * Math.sin(gx * 3.2 + t * 1.2);
                
                let h = wave1 * 0.85 + wave2 * 0.7 + radial * 0.75 + ripples * 0.6 + flow * 0.4;
                return Math.min(HEIGHT_MAX, Math.max(HEIGHT_MIN, h));
            }
            
            function initContourLevels() {
                const levels = [];
                for (let i = 0; i <= CONTOUR_COUNT; i++) {
                    const t = i / CONTOUR_COUNT;
                    let val = HEIGHT_MIN + (HEIGHT_MAX - HEIGHT_MIN) * Math.pow(t, 1.05);
                    levels.push(val);
                }
                return levels;
            }
            
            function updateHeightMap(t) {
                const rows = sampleRows;
                const cols = sampleCols;
                for (let i = 0; i < rows; i++) {
                    const y = i / (rows - 1);
                    const row = heightMap[i];
                    for (let j = 0; j < cols; j++) {
                        const x = j / (cols - 1);
                        row[j] = organicHeight(x, y, t);
                    }
                }
            }
            
            // Extraer segmentos de contorno (marching squares)
            function extractContourSegments(level, w, h) {
                const rows = sampleRows;
                const cols = sampleCols;
                const stepX = w / (cols - 1);
                const stepY = h / (rows - 1);
                
                let segments = [];
                
                for (let i = 0; i < rows - 1; i++) {
                    for (let j = 0; j < cols - 1; j++) {
                        const v00 = heightMap[i][j];
                        const v10 = heightMap[i][j+1];
                        const v01 = heightMap[i+1][j];
                        const v11 = heightMap[i+1][j+1];
                        
                        const x0 = j * stepX;
                        const y0 = i * stepY;
                        const x1 = (j+1) * stepX;
                        const y1 = (i+1) * stepY;
                        
                        let points = [];
                        
                        if ((v00 - level) * (v10 - level) < 0) {
                            const tInt = (level - v00) / (v10 - v00);
                            points.push({x: x0 + tInt * stepX, y: y0});
                        }
                        if ((v10 - level) * (v11 - level) < 0) {
                            const tInt = (level - v10) / (v11 - v10);
                            points.push({x: x1, y: y0 + tInt * stepY});
                        }
                        if ((v01 - level) * (v11 - level) < 0) {
                            const tInt = (level - v01) / (v11 - v01);
                            points.push({x: x0 + tInt * stepX, y: y1});
                        }
                        if ((v00 - level) * (v01 - level) < 0) {
                            const tInt = (level - v00) / (v01 - v00);
                            points.push({x: x0, y: y0 + tInt * stepY});
                        }
                        
                        if (points.length === 2) {
                            segments.push({ p1: points[0], p2: points[1] });
                        } else if (points.length === 4) {
                            const centerVal = (v00 + v10 + v01 + v11) * 0.25;
                            if (centerVal > level) {
                                segments.push({ p1: points[0], p2: points[2] });
                                segments.push({ p1: points[1], p2: points[3] });
                            } else {
                                segments.push({ p1: points[0], p2: points[3] });
                                segments.push({ p1: points[1], p2: points[2] });
                            }
                        }
                    }
                }
                
                let chains = [];
                let used = new Array(segments.length).fill(false);
                
                for (let i = 0; i < segments.length; i++) {
                    if (used[i]) continue;
                    let chain = [segments[i].p1, segments[i].p2];
                    used[i] = true;
                    let changed = true;
                    while (changed) {
                        changed = false;
                        for (let j = 0; j < segments.length; j++) {
                            if (used[j]) continue;
                            const pA = segments[j].p1;
                            const pB = segments[j].p2;
                            const first = chain[0];
                            const last = chain[chain.length - 1];
                            const epsilon = 0.001;
                            if (Math.hypot(last.x - pA.x, last.y - pA.y) < epsilon) {
                                chain.push(pB);
                                used[j] = true;
                                changed = true;
                            } else if (Math.hypot(last.x - pB.x, last.y - pB.y) < epsilon) {
                                chain.push(pA);
                                used[j] = true;
                                changed = true;
                            } else if (Math.hypot(first.x - pA.x, first.y - pA.y) < epsilon) {
                                chain.unshift(pB);
                                used[j] = true;
                                changed = true;
                            } else if (Math.hypot(first.x - pB.x, first.y - pB.y) < epsilon) {
                                chain.unshift(pA);
                                used[j] = true;
                                changed = true;
                            }
                        }
                    }
                    if (chain.length >= 3) chains.push(chain);
                }
                return chains;
            }
            
            // Suavizado Catmull-Rom para curvas orgánicas
            function smoothChain(points, stepsPerSegment = 4) {
                if (points.length < 3) return points;
                const result = [];
                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = points[(i - 1 + points.length) % points.length];
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const p3 = points[(i + 2) % points.length];
                    
                    for (let t = 0; t <= 1; t += 1 / stepsPerSegment) {
                        const t2 = t * t;
                        const t3 = t2 * t;
                        const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
                        const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
                        result.push({x, y});
                    }
                }
                return result;
            }
            
            // Dibujar contornos en blanco puro con variación elegante
            function drawSmoothContours(ctx, w, h, currentTime) {
                for (let idx = 0; idx < contourLevels.length; idx++) {
                    const level = contourLevels[idx];
                    const chains = extractContourSegments(level, w, h);
                    if (chains.length === 0) continue;
                    
                    const norm = (level - HEIGHT_MIN) / (HEIGHT_MAX - HEIGHT_MIN);
                    const alpha = 0.6 + norm * 0.3 + 0.08 * Math.sin(level * 4.2 + currentTime * 1.5);
                    
                    // Blanco puro con leve variación para dar profundidad
                    const intensity = 220 + Math.floor(35 * norm);
                    const r = Math.min(255, intensity);
                    const g = Math.min(255, intensity + 5);
                    const b = Math.min(255, 245 + Math.floor(10 * norm));
                    
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    ctx.lineWidth = 0.8 + norm * 0.65;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    for (let chain of chains) {
                        if (chain.length < 3) continue;
                        const smoothPoints = smoothChain(chain, 4);
                        if (smoothPoints.length < 2) continue;
                        ctx.beginPath();
                        ctx.moveTo(smoothPoints[0].x, smoothPoints[0].y);
                        for (let k = 1; k < smoothPoints.length; k++) {
                            ctx.lineTo(smoothPoints[k].x, smoothPoints[k].y);
                        }
                        ctx.stroke();
                    }
                }
            }
            
            // Reflejos sutiles blancos
            function addMinimalGlow(ctx, w, h, t) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (let i = 0; i < 18; i++) {
                    const phase = t * 0.5 + i * 1.9;
                    const x = (Math.sin(phase * 0.71) * 0.45 + 0.5) * w;
                    const y = (Math.cos(phase * 0.63) * 0.4 + 0.55) * h;
                    const rad = 2.2 + 1.4 * Math.sin(t * 2.1 + i);
                    const grad = ctx.createRadialGradient(x, y, 0, x, y, rad * 2.0);
                    grad.addColorStop(0, `rgba(255, 255, 255, 0.28)`);
                    grad.addColorStop(0.6, `rgba(230, 240, 255, 0.1)`);
                    grad.addColorStop(1, `rgba(200, 210, 255, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(x, y, rad, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
            
            function addWhiteMist(ctx, w, h) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                const grad = ctx.createLinearGradient(0, 0, w * 0.7, h * 0.5);
                grad.addColorStop(0, `rgba(245, 250, 255, 0.04)`);
                grad.addColorStop(1, `rgba(255, 255, 255, 0.02)`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }
            
            function updateResolution() {
                let targetCols = Math.floor(width / 7);
                targetCols = Math.min(210, Math.max(130, targetCols));
                let targetRows = Math.floor(targetCols * (height / width));
                targetRows = Math.min(140, Math.max(90, targetRows));
                
                if (sampleCols !== targetCols || sampleRows !== targetRows) {
                    sampleCols = targetCols;
                    sampleRows = targetRows;
                    heightMap = new Array(sampleRows);
                    for (let i = 0; i < sampleRows; i++) {
                        heightMap[i] = new Float32Array(sampleCols);
                    }
                }
            }
            
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                updateResolution();
                updateHeightMap(time);
            }
            
            function animate() {
                if (!ctx) return;
                time += 0.0155;
                if (time > Math.PI * 10) time -= Math.PI * 5;
                updateHeightMap(time);
                
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, width, height);
                
                drawSmoothContours(ctx, width, height, time);
                addMinimalGlow(ctx, width, height, time);
                addWhiteMist(ctx, width, height);
                
                // Pequeños destellos blancos
                ctx.globalCompositeOperation = 'lighter';
                for (let i = 0; i < 10; i++) {
                    const shimmer = Math.sin(time * 2.3 + i) * 0.5 + 0.5;
                    if (shimmer > 0.75) {
                        const x = (Math.sin(time * 0.85 + i) * 0.48 + 0.5) * width;
                        const y = (Math.cos(time * 0.8 + i * 1.2) * 0.45 + 0.5) * height;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.8, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${shimmer * 0.25})`;
                        ctx.fill();
                    }
                }
                ctx.globalCompositeOperation = 'source-over';
                
                animationId = requestAnimationFrame(animate);
            }
            
            function initCanvas() {
                ctx = canvas.getContext('2d');
                if (!ctx) return;
                contourLevels = initContourLevels();
                resizeCanvas();
                window.addEventListener('resize', () => resizeCanvas());
                animate();
            }
            
            initCanvas();
            
            // Botón Discord con redirección
            const discordBtn = document.getElementById('discordButton');
            if (discordBtn) {
                discordBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.open('https://discord.gg/ujytkPGja', '_blank');
                });
                discordBtn.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        window.open('https://discord.gg/ujytkPGja', '_blank');
                    }
                });
            }
        })();
    </script>
</body>
</html>
